name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hc-bentill/subly-api

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on GitHub runners)
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/"

  image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Runs on the self-hosted runner on k3s-control, which can reach the private 192.168.100.x subnet.
  # (PayFlow's cloud runners couldn't SSH in; this avoids that blocker.)
  deploy:
    needs: image
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests and roll out
        env:
          KUBECONFIG: /home/henry/.kube/config
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/configmap.yaml -f k8s/service.yaml -f k8s/deployment.yaml
          kubectl -n subly set image deployment/subly-api subly-api=${{ env.IMAGE }}:${{ github.sha }}
          kubectl -n subly rollout status deployment/subly-api --timeout=180s

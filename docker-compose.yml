# Local dev dependencies. Host ports are offset (+1) so Subly can run alongside PayFlow.
#   Postgres 5433, Redis 6380, Kafka 9094, Prometheus 9091, Grafana 3001
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subly
      POSTGRES_USER: subly
      POSTGRES_PASSWORD: subly
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subly -d subly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1          # KRaft mode, no ZooKeeper
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  prometheus:
    image: prom/prometheus:latest
    ports: ["9091:9090"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  # Full stack in containers: `docker compose --profile app up --build`
  subly-api:
    profiles: [app]
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SUBLY_DB_URL: jdbc:postgresql://postgres:5432/subly
      SUBLY_REDIS_HOST: redis
      SUBLY_REDIS_PORT: "6379"
      SUBLY_KAFKA_BOOTSTRAP: kafka:9092
      SUBLY_JWT_SECRET: ${SUBLY_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }

volumes:
  pgdata:

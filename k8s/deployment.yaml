apiVersion: apps/v1
kind: Deployment
metadata:
  name: subly-api
  namespace: subly
  labels: { app: subly-api }
spec:
  replicas: 1                       # homelab CPU is tight (PayFlow lesson)
  selector:
    matchLabels: { app: subly-api }
  template:
    metadata:
      labels: { app: subly-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: subly-api
          image: ghcr.io/hc-bentill/subly-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: subly-config }
            - secretRef: { name: subly-secrets }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10

# Copy to secret.yaml (git-ignored), fill in, then: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: subly-secrets
  namespace: subly
type: Opaque
stringData:
  SUBLY_DB_USER: subly
  SUBLY_DB_PASSWORD: change-me
  SUBLY_JWT_SECRET: change-me-to-at-least-32-random-characters

spring:
  application:
    name: subly
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SUBLY_DB_URL:jdbc:postgresql://localhost:5433/subly}
    username: ${SUBLY_DB_USER:subly}
    password: ${SUBLY_DB_PASSWORD:subly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${SUBLY_REDIS_HOST:localhost}
      port: ${SUBLY_REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${SUBLY_KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: subly
      enable-auto-commit: false   # commit only after successful processing (PayFlow rule)
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

subly:
  jwt:
    secret: ${SUBLY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: subly
    ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness and /readiness for k8s
      show-details: always
  metrics:
    tags:
      application: subly

server:
  port: 8080
  shutdown: graceful
